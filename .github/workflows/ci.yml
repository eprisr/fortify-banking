# ADR-021: one workflow, run on every pull request and every push to main.
# Nothing here needs a real secret. Jest runs on MSW mocks and .env.test, and
# the build only needs placeholder values so SDK clients can be constructed.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch or PR cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, build, type check, test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Disposable Postgres for the ledger tests (ADR-016). Same major version
    # as Neon's default. The suite drops and rebuilds its schema each run.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ledger_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Placeholders, not credentials. The Dwolla and Plaid SDKs validate their
    # config when the module loads, so `next build` fails without these.
    env:
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_APPWRITE_ENDPOINT: https://appwrite.invalid/v1
      NEXT_PUBLIC_APPWRITE_PROJECT_ID: ci-placeholder
      APPWRITE_KEY: ci-placeholder
      PLAID_CLIENT_ID: ci-placeholder
      PLAID_SECRET: ci-placeholder
      PLAID_ENV: sandbox
      DWOLLA_KEY: ci-placeholder
      DWOLLA_SECRET: ci-placeholder
      DWOLLA_ENV: sandbox
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/ledger_test
      ACCOUNT_ID_ENCRYPTION_KEY: 'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=' # 32 zero bytes, base64

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      # Runs before the type check because it generates next-env.d.ts, which
      # holds the image and SVG module types tsc needs.
      - name: Build
        run: npm run build

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npx jest --coverage=false
